platform:
  ingress-nginx:
    enabled: true
    namespace: ingress-nginx
    repoName: ingress-nginx
    repoUrl: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx/ingress-nginx
    releaseName: ingress-nginx
    valuesFile: platform/ingress-nginx/values.yaml

  cert-manager:
    enabled: true
    namespace: cert-manager
    repoName: jetstack
    repoUrl: https://charts.jetstack.io
    chart: jetstack/cert-manager
    releaseName: cert-manager
    valuesFile: platform/cert-manager/values.yaml

stacks:
  nginx:
    enabled: true
    namespace: nginx
    repoName: bitnami
    repoUrl: https://charts.bitnami.com/bitnami
    chart: bitnami/nginx
    releaseName: nginx
    valuesFile: stacks/nginx/values.yaml
    hostname: nginx.example.com

  redis:
    enabled: true
    namespace: redis
    repoName: bitnami
    repoUrl: https://charts.bitnami.com/bitnami
    chart: bitnami/redis
    releaseName: redis
    valuesFile: stacks/redis/values.yaml

  prometheus-grafana:
    enabled: true
    namespace: monitoring
    repoName: prometheus-community
    repoUrl: https://prometheus-community.github.io/helm-charts
    chart: prometheus-community/kube-prometheus-stack
    releaseName: prometheus-grafana
    valuesFile: stacks/prometheus-grafana/values.yaml
    hostname: grafana.example.com

  argocd:
    enabled: true
    namespace: argocd
    repoName: argo
    repoUrl: https://argoproj.github.io/argo-helm
    chart: argo/argo-cd
    releaseName: argocd
    valuesFile: stacks/argocd/values.yaml
    hostname: argocd.example.com

  elk:
    enabled: true
    namespace: elastic-system
    repoName: elastic
    repoUrl: https://helm.elastic.co
    chart: elastic/eck-operator
    releaseName: eck-operator
    valuesFile: stacks/elk/values.yaml